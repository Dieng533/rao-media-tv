<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Administration - RAO MEDIA TV</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="login-body">

    <div class="login-card">
        <div class="login-header">
            <a href="../index.html">
                <img src="../assets/images/logo.png" alt="RAO MEDIA TV" style="height: 60px; object-fit: contain;">
            </a>
            <h5 class="text-white mt-3 mb-0 fw-bold">Espace Administration</h5>
            <small class="text-white opacity-75">Portail de gestion éditoriale</small>
        </div>

        <div class="p-4 p-md-5">
            <div id="login-alert" class="alert alert-danger d-none py-2 small mb-3"></div>

            <form id="admin-login-form">
                <div class="mb-3">
                    <label for="login-email" class="form-label small fw-bold text-dark">Adresse Email</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" id="login-email" class="form-control" placeholder="nom@raomediatv.com" required value="admin@raomediatv.com">
                    </div>
                </div>

                <div class="mb-4">
                    <div class="d-flex justify-content-between">
                        <label for="login-password" class="form-label small fw-bold text-dark">Mot de passe</label>
                    </div>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" id="login-password" class="form-control" placeholder="••••••••" required value="Admin123!">
                    </div>
                </div>

                <button type="submit" class="btn btn-danger w-100 py-2 fw-bold mb-3" style="background-color: #D71920; border: none;">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Se Connecter
                </button>
            </form>

            <!-- Bouton pour remplir les identifiants de démonstration -->
            <button id="btn-fill-demo" class="btn btn-outline-secondary btn-sm w-100 mb-3">
                <i class="bi bi-magic me-1"></i> Remplir avec les identifiants démo
            </button>

            <div class="text-center pt-3 border-top">
                <a href="../index.html" class="text-muted small text-decoration-none">
                    <i class="bi bi-arrow-left me-1"></i> Retour au site public
                </a>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle & Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/storage.js"></script>
    <script src="../assets/js/admin.js"></script>
</body>
</html>
